<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#18181f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#d4af37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle for Google favicon visibility -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />

  <!-- Stylized Monogram "G" for GAMURA -->
  <g filter="url(#glow)">
    <!-- Outer ring of the G -->
    <path d="M 360 170 
             A 140 140 0 1 0 380 320 
             L 380 256 
             L 256 256 
             L 256 304 
             L 332 304 
             A 92 92 0 1 1 316 198 
             L 360 170 Z" 
          fill="url(#goldGrad)" />
          
    <!-- Central Galactic Core star / diamond -->
    <polygon points="256,190 270,218 298,218 274,236 284,264 256,246 228,264 238,236 214,218 242,218" 
             fill="#ffffff" opacity="0.9" />
  </g>

  <!-- GAMURA wordmark subtle anchor -->
  <text x="256" y="440" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="10">GAMURA</text>
</svg>
